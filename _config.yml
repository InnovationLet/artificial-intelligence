title: "InnovationLet Artificial Intelligence"
short_title: "Artificial Intelligence"
tagline: "Frontier models, research, and the rules around them."
description: >-
  InnovationLet Artificial Intelligence covers machine learning models,
  research, autonomous agents and the policy shaping AI. Independent
  reporting and analysis from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/artificial-intelligence"
main_site: "https://innovationlet.github.io"

category_name: "Artificial Intelligence"
category_meta: "Models · Research · Policy"
accent: "blue"
hero_title: "Machine learning, minus the hype."
hero_lead: >-
  Models, research and policy, explained for the people who build and
  deploy AI rather than the people who pitch it.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
